services:
  cleanalyze:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PORT=8080
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./.env:/var/www/html/.env:ro
      - auth-data:/var/www/html/auth/data
      - cleanalyze-uploads:/var/www/html/uploads
      - cleanalyze-rag:/var/www/html/uploads/rag
      - cleanalyze-logs:/var/www/html/logs

volumes:
  auth-data:
    name: cleanalyze_auth-data
  cleanalyze-uploads:
    name: cleanalyze_uploads
  cleanalyze-rag:
    name: cleanalyze_rag
  cleanalyze-logs:
    name: cleanalyze_logs
