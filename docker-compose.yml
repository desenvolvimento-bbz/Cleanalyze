services:
  cleanalyze:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      MISTRAL_OCR_MODEL: ${MISTRAL_OCR_MODEL:-mistral-ocr-latest}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_CHAT_MODEL: ${RAG_CHAT_MODEL:-gpt-4o-mini}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-800}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-100}
      RAG_TOP_K: ${RAG_TOP_K:-5}
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - auth-data:/var/www/html/auth/data
      - cleanalyze-uploads:/var/www/html/uploads
      - cleanalyze-rag:/var/www/html/uploads/rag
      - cleanalyze-logs:/var/www/html/logs

volumes:
  auth-data:
    name: cleanalyze_auth-data
  cleanalyze-uploads:
    name: cleanalyze_uploads
  cleanalyze-rag:
    name: cleanalyze_rag
  cleanalyze-logs:
    name: cleanalyze_logs
