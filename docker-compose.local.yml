services:
  cleanalyze:
    build:
      context: .
      dockerfile: dockerfile
    environment:
      - PORT=8080
      - GOOGLE_CLIENT_ID=330639050078-cuj6n6ag45fbpuior5aevo0scslp6n8c.apps.googleusercontent.com
    ports:
      - "8080:8080"
    volumes:
      # Código-fonte ao vivo: qualquer .php/.py editado no host vale no próximo request
      - .:/var/www/html
      # Preserva o vendor/ instalado pelo Composer na imagem (o bind acima o cobriria)
      - /var/www/html/vendor
